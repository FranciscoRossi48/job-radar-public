[project]
name = "job-radar"
version = "0.1.0"
description = "Buscador y filtro local de ofertas laborales (CH / NL / LU)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-jobspy>=1.3.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
job-radar = "job_radar.cli:app"
job-radar-mcp = "job_radar.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# El largo de línea lo maneja `ruff format`; strings y comentarios largos se toleran.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: llama a APIs reales (correr con JOB_RADAR_LIVE=1)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
